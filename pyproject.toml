[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbol-visual-eval"
version = "0.1.0"
description = "Machine evaluation of SBOL Visual compliance in genetic-design diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "curl-cffi>=0.16,<1",
  "cryptography>=42,<47",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "rapidfuzz>=3.14,<4",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "anthropic>=0.69,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "reportlab>=4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
sbol-visual-data = "sbol_visual_eval.cli:main"
sbol-visual-eval = "sbol_visual_eval.evaluator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbol_visual_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"
